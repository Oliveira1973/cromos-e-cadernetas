<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>As Minhas Cadernetas</title>
<meta name="theme-color" content="#e7dab8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper: #e7dab8;
    --paper-dark: #d8c79e;
    --paper-darker: #c9b98c;
    --ink: #2b2420;
    --ink-soft: #5a5044;
    --stamp-red: #b8433a;
    --stamp-red-soft: #b8433a55;
    --teal: #2f6b62;
    --mustard: #cc9a1f;
    --line: #b7a67c;
    --card-bg: #f2ead4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, #f0e5c8 0%, transparent 55%),
      var(--paper);
    background-attachment: fixed;
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  /* subtle paper grain */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    opacity:0.05;
    background-image:
      repeating-linear-gradient(0deg, #000 0, #000 1px, transparent 1px, transparent 3px);
    mix-blend-mode:multiply;
    z-index:0;
  }
  .wrap{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding: 20px 18px 80px;}

  header.top{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap: 16px; flex-wrap:wrap;
    border-bottom: 3px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 22px;
  }
  header.top .title-block h1{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size: clamp(2.1rem, 6vw, 3.2rem);
    letter-spacing: 0.5px;
    margin:0;
    line-height:0.95;
    color:var(--ink);
  }
  header.top .title-block .sub{
    font-family:'Space Mono', monospace;
    font-size:0.78rem;
    color:var(--ink-soft);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-top:6px;
  }
  .global-stats{
    display:flex; gap:18px; font-family:'Space Mono', monospace;
  }
  .global-stats .stat{ text-align:right; }
  .global-stats .stat .num{ font-size:1.6rem; font-weight:700; color:var(--stamp-red); display:block; line-height:1; }
  .global-stats .stat .lbl{ font-size:0.62rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); }

  .toolbar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    margin-bottom:22px;
  }
  .acoes-topo{ margin-bottom:14px; }
  .botao-secundario{
    font-family:'Space Mono', monospace;
    background:var(--teal);
    color:var(--paper);
    border:2px solid var(--ink);
    border-radius:2px;
    padding:9px 14px;
    font-size:0.82rem;
    font-weight:700;
    cursor:pointer;
  }
  .botao-secundario:hover{ background:#1f4e47; }
  .toolbar input[type="search"], .toolbar select{
    font-family:'Work Sans', sans-serif;
    font-size:0.9rem;
    padding:9px 12px;
    border:2px solid var(--ink);
    background:var(--card-bg);
    color:var(--ink);
    border-radius:2px;
  }
  .toolbar input[type="search"]{ flex:1; min-width:160px; }
  .toolbar label.switch{
    display:flex; align-items:center; gap:6px;
    font-size:0.82rem; font-family:'Space Mono',monospace;
    color:var(--ink-soft); cursor:pointer;
    padding:9px 10px; border:2px dashed var(--line); border-radius:2px;
  }
  .toolbar label.switch input{ accent-color:var(--stamp-red); }

  /* grid of cadernetas */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
  }
  .cad-card{
    position:relative;
    background:var(--card-bg);
    border:2px solid var(--ink);
    border-radius:3px;
    padding:0;
    cursor:pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 4px 4px 0 var(--paper-darker);
    overflow:hidden;
  }
  .cad-card:hover{ transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--paper-darker); }
  .cad-card:focus-visible{ outline: 3px solid var(--teal); outline-offset:2px; }
  .cad-card .cover{
    aspect-ratio: 3/4;
    background: linear-gradient(135deg, var(--teal), #1f4e47);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .cad-card .cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .cad-card .cover.imagem-auto{ aspect-ratio:auto; background:var(--paper-darker); }
  .cad-card .cover.imagem-auto img{ height:auto; object-fit:contain; }
  .cad-card .cover .placeholder{
    font-family:'Anton', sans-serif;
    color:#f2ead4d0;
    font-size:2.6rem;
    text-align:center;
    padding: 10px;
    line-height:1;
  }
  .cad-card .cover .tape{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%) rotate(-2deg);
    width:70px; height:22px;
    background:#f2ead4b3;
    border:1px solid #ffffff55;
  }
  .stamp-badge{
    position:absolute; top:8px; right:8px;
    width:52px; height:52px;
    border-radius:50%;
    border:2.5px dashed var(--stamp-red);
    display:flex; align-items:center; justify-content:center;
    background: #f2ead4cc;
    transform: rotate(-10deg);
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:0.85rem;
    color:var(--stamp-red);
  }
  .stamp-badge.complete{ border-color:var(--teal); color:var(--teal); border-style:solid; }
  .cad-card .info{ padding:12px 12px 14px; }
  .cad-card .editora{
    font-family:'Space Mono', monospace;
    font-size:0.68rem; text-transform:uppercase; letter-spacing:0.07em;
    color:var(--stamp-red); margin-bottom:2px;
  }
  .cad-card .tema-tag{
    color:var(--teal);
    font-weight:700;
  }
  .cad-card h3{
    font-family:'Anton', sans-serif; font-weight:400;
    font-size:1.15rem; margin:0 0 6px; line-height:1.05;
  }
  .cad-card .meta{
    font-family:'Space Mono', monospace; font-size:0.7rem;
    color:var(--ink-soft);
  }
  .cad-card .bar-track{
    height:6px; background:var(--paper-darker); border:1px solid var(--ink);
    margin-top:8px; border-radius:2px; overflow:hidden;
  }
  .cad-card .bar-fill{ height:100%; background:var(--stamp-red); }
  .cad-card .bar-fill.complete{ background:var(--teal); }

  /* empty state */
  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
    font-family:'Space Mono', monospace;
  }

  /* detail view */
  #detail{ display:none; }
  #detail.active{ display:block; }
  #listView.hidden{ display:none; }
  #repetidosGeral{ display:none; }
  #repetidosGeral.active{ display:block; }

  .repetidos-titulo{
    font-family:'Anton', sans-serif; font-weight:400;
    font-size:1.8rem; margin:0 0 18px;
  }
  .repetidos-grid{
    display:flex; flex-wrap:wrap; gap:14px;
    align-items:flex-start;
  }
  .repetidos-grupo{
    display:contents;
  }
  .mini-capa{
    width:76px;
    cursor:pointer;
    position:relative;
    flex-shrink:0;
  }
  .mini-capa-img{
    width:76px; height:100px;
    border:2px solid var(--ink);
    border-radius:2px;
    background:linear-gradient(135deg, var(--teal), #1f4e47);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .mini-capa-img img{
    width:100%; height:100%;
    object-fit:contain;
    background:var(--paper-darker);
    display:block;
  }
  .mini-capa-placeholder{
    font-family:'Anton', sans-serif;
    color:#f2ead4d0;
    font-size:1.3rem;
  }
  .mini-capa-nome{
    font-family:'Space Mono', monospace;
    font-size:0.62rem;
    text-align:center;
    margin-top:4px;
    line-height:1.15;
    overflow:hidden; text-overflow:ellipsis;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }
  .mini-capa-badge{
    position:absolute; top:-8px; right:-8px;
    background:var(--stamp-red); color:var(--paper);
    border:2px solid var(--ink);
    border-radius:50%;
    width:24px; height:24px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono', monospace;
    font-size:0.7rem; font-weight:700;
  }
  .repetidos-grupo.expandido{
    flex-basis:100%;
    display:flex;
    gap:16px;
    align-items:flex-start;
    background:var(--card-bg);
    border:2px dashed var(--line);
    border-radius:3px;
    padding:12px;
  }
  .repetidos-grupo.expandido .mini-capa{ flex-shrink:0; }
  .repetidos-lista{
    display:none;
    flex-wrap:wrap; gap:8px;
    flex:1;
  }
  .repetidos-grupo.expandido .repetidos-lista{ display:flex; }
  .repetido-item{
    display:flex; align-items:center; gap:6px;
    background:var(--paper);
    border:2px solid var(--ink);
    border-radius:2px;
    padding:6px 10px;
    font-family:'Space Mono', monospace;
    font-size:0.8rem;
    cursor:pointer;
    align-self:flex-start;
  }
  .repetido-item:hover{ background:var(--paper-darker); }
  .repetido-item .qtd{
    background:var(--teal); color:var(--paper);
    border-radius:10px; padding:1px 7px; font-weight:700; font-size:0.72rem;
  }

  .back-btn{
    font-family:'Space Mono', monospace;
    background:none; border:2px solid var(--ink); border-radius:2px;
    padding:8px 14px; cursor:pointer; font-size:0.8rem;
    color:var(--ink); margin-bottom:16px;
  }
  .back-btn:hover{ background:var(--ink); color:var(--paper); }

  .detail-header{
    display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap;
    border-bottom:3px solid var(--ink); padding-bottom:18px; margin-bottom:18px;
  }
  .detail-cover{
    width:110px; aspect-ratio:3/4; border:2px solid var(--ink); border-radius:3px;
    background:linear-gradient(135deg, var(--teal), #1f4e47);
    display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;
  }
  .detail-cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .detail-cover.imagem-auto{ aspect-ratio:auto; height:auto; background:var(--paper-darker); }
  .detail-cover.imagem-auto img{ height:auto; object-fit:contain; }
  .detail-cover .placeholder{ font-family:'Anton',sans-serif; color:#f2ead4d0; font-size:1.8rem; }
  .detail-title h2{ font-family:'Anton', sans-serif; font-weight:400; font-size:1.8rem; margin:0 0 4px; }
  .detail-title .editora-ano{ font-family:'Space Mono', monospace; font-size:0.78rem; color:var(--stamp-red); text-transform:uppercase; letter-spacing:0.06em; }
  .detail-stats{ display:flex; gap:20px; margin-top:10px; font-family:'Space Mono', monospace; }
  .detail-stats .stat .num{ font-size:1.3rem; font-weight:700; }
  .detail-stats .stat .lbl{ font-size:0.6rem; text-transform:uppercase; color:var(--ink-soft); letter-spacing:0.06em; }
  .detail-progress{ margin-top:12px; height:10px; background:var(--paper-darker); border:1px solid var(--ink); border-radius:2px; overflow:hidden; }
  .detail-progress .fill{ height:100%; background:var(--stamp-red); }
  .detail-progress .fill.complete{ background:var(--teal); }

  .cromos-toolbar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }

  .cromos-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .cromo{
    position:relative;
    width:100px;
    height:auto;
    border:2px solid var(--ink);
    border-radius:2px;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    font-family:'Space Mono', monospace;
    background:var(--card-bg);
    cursor:pointer;
    padding:0;
    text-align:center;
    overflow:hidden;
    flex-shrink:0;
  }
  .cromo.tenho{ border-color:var(--teal); }
  .cromo.falta{ border-style:dashed; color:var(--ink-soft); }
  .cromo .conteudo{
    height:110px;
    background:var(--card-bg);
  }
  .cromo.tenho .conteudo{ background:#dfe9d8; }
  .cromo.falta .conteudo{
    background:repeating-linear-gradient(45deg, var(--paper-darker), var(--paper-darker) 4px, var(--card-bg) 4px, var(--card-bg) 8px);
  }
  .cromo.tem-imagem{ cursor:zoom-in; }
  .cromo .conteudo img{
    width:100%;
    height:100%;
    object-fit:contain;
    background:var(--paper-darker);
    display:block;
  }
  .cromo.tem-imagem.falta .conteudo img{ filter: grayscale(0.85) brightness(0.9); opacity:0.55; }
  .cromo .legenda{
    display:flex; align-items:center; gap:4px;
    background:var(--ink);
    padding:3px 4px;
    min-width:0;
  }
  .cromo.falta .legenda{ background:var(--ink-soft); }
  .cromo.foil .legenda{
    background: linear-gradient(120deg, #8a8a8a 0%, #e8e8e8 20%, #b8b8b8 40%, #f5f5f5 60%, #8a8a8a 80%, #d0d0d0 100%);
    background-size: 250% 100%;
    animation: foil-shimmer 3.5s linear infinite;
  }
  .cromo.foil .legenda .nome{ color:#1a1a1a; text-shadow:0 1px 0 rgba(255,255,255,0.5); }
  @keyframes foil-shimmer{
    0%{ background-position: 0% 50%; }
    100%{ background-position: 250% 50%; }
  }
  .cromo .legenda .num{
    flex-shrink:0;
    background:var(--stamp-red);
    color:var(--paper);
    font-size:0.68rem;
    font-weight:700;
    padding:1px 5px;
    border-radius:2px;
  }
  .cromo .legenda .nome{
    display:block;
    margin-top:0;
    color:var(--paper);
    font-size:0.6rem;
    line-height:1.2;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
  }
  .cromo .star{
    position:absolute; top:-7px; right:-7px;
    width:18px; height:18px;
    background:var(--mustard);
    border-radius:50%;
    border:1.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:0.6rem;
  }
  .cromo .repetido-badge{
    position:absolute; top:-7px; left:-7px;
    background:var(--teal);
    color:var(--paper);
    border:1.5px solid var(--ink);
    border-radius:10px;
    padding:1px 6px;
    font-family:'Space Mono', monospace;
    font-size:0.58rem;
    font-weight:700;
  }

  footer{
    text-align:center; margin-top:60px; padding-top:20px;
    border-top:1px dashed var(--line);
    font-family:'Space Mono', monospace; font-size:0.7rem; color:var(--ink-soft);
  }

  /* lightbox de ampliação do cromo */
  .lightbox{
    position:fixed; inset:0; z-index:1000;
    background:rgba(20,16,12,0.82);
    display:none;
    align-items:center; justify-content:center;
    padding:24px;
    cursor:zoom-out;
  }
  .lightbox.aberto{ display:flex; }
  .lightbox-conteudo{
    max-width:min(88vw, 480px);
    max-height:88vh;
    display:flex; flex-direction:column; align-items:center;
    animation: lightbox-pop 0.16s ease-out;
  }
  @keyframes lightbox-pop{
    from{ transform:scale(0.92); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }
  .lightbox-conteudo img{
    max-width:100%;
    max-height:75vh;
    width:auto; height:auto;
    display:block;
    border:3px solid var(--paper);
    border-radius:3px;
    box-shadow:0 12px 32px rgba(0,0,0,0.5);
    background:var(--card-bg);
  }
  .lightbox-legenda{
    margin-top:14px;
    font-family:'Space Mono', monospace;
    color:var(--paper);
    text-align:center;
  }
  .lightbox-linha1{
    display:flex; align-items:baseline; gap:10px; justify-content:center;
    flex-wrap:wrap;
  }
  #lightboxNum{
    background:var(--stamp-red);
    color:var(--paper);
    padding:3px 9px;
    border-radius:2px;
    font-weight:700;
    font-size:0.85rem;
  }
  #lightboxNome{
    font-size:0.95rem;
  }
  .lightbox-clube{
    margin-top:6px;
    font-size:0.78rem;
    color:var(--paper);
    opacity:0.75;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .lightbox-clube:empty{ display:none; }

  .lightbox-repetido{
    margin-top:14px;
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-family:'Space Mono', monospace;
    color:var(--paper);
    font-size:0.8rem;
  }
  .lightbox-repetido button{
    width:32px; height:32px;
    border-radius:50%;
    border:2px solid var(--paper);
    background:transparent;
    color:var(--paper);
    font-size:1.1rem;
    font-weight:700;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    line-height:1;
  }
  .lightbox-repetido button:hover{ background:rgba(255,255,255,0.15); }
  .lightbox-repetido button:active{ transform:scale(0.92); }
  #repQtd{
    min-width:24px; text-align:center;
    font-size:1rem; font-weight:700;
    color:var(--mustard);
  }

  @media (prefers-reduced-motion: reduce){
    .cad-card{ transition:none; }
    .cromo.foil .legenda{ animation:none; background-position:50% 50%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="title-block">
      <h1>As Minhas Cadernetas</h1>
      <div class="sub">coleção de cromos &middot; faltas &amp; repetidos</div>
    </div>
    <div class="global-stats" id="globalStats"></div>
  </header>

  <div id="listView">
    <div class="acoes-topo" id="acoesTopo" style="display:none;">
      <button id="btnVerRepetidos" class="botao-secundario">🔁 Os meus repetidos</button>
    </div>
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Procurar caderneta ou editora...">
      <select id="editoraFilter">
        <option value="">Todas as editoras</option>
      </select>
      <select id="temaFilter">
        <option value="">Todos os temas</option>
      </select>
      <label class="switch">
        <input type="checkbox" id="incompleteOnly">
        só por completar
      </label>
    </div>
    <div class="grid" id="cadGrid"></div>
    <div class="empty" id="emptyState" style="display:none;">Nenhuma caderneta encontrada.</div>
  </div>

  <div id="repetidosGeral">
    <button class="back-btn" id="backBtnRepetidos">&larr; voltar às cadernetas</button>
    <h2 class="repetidos-titulo">🔁 Os meus repetidos</h2>
    <div id="repetidosGeralConteudo">
      <div class="empty">A carregar...</div>
    </div>
  </div>

  <div id="detail">
    <button class="back-btn" id="backBtn">&larr; voltar às cadernetas</button>
    <div class="detail-header">
      <div class="detail-cover" id="detailCover"></div>
      <div class="detail-title">
        <h2 id="detailNome"></h2>
        <div class="editora-ano" id="detailEditoraAno"></div>
        <div class="detail-stats">
          <div class="stat"><span class="num" id="detailTenho"></span><span class="lbl">tenho</span></div>
          <div class="stat"><span class="num" id="detailFalta"></span><span class="lbl">faltam</span></div>
          <div class="stat"><span class="num" id="detailPct"></span><span class="lbl">completo</span></div>
        </div>
        <div class="detail-progress"><div class="fill" id="detailFill"></div></div>
      </div>
    </div>

    <div class="cromos-toolbar">
      <input type="search" id="cromoSearch" placeholder="Procurar número ou nome...">
      <label class="switch">
        <input type="checkbox" id="cromoFaltaOnly">
        só faltas
      </label>
      <label class="switch">
        <input type="checkbox" id="cromoEspecialOnly">
        só especiais
      </label>
      <label class="switch" id="cromoRepetidoOnlyWrap" style="display:none;">
        <input type="checkbox" id="cromoRepetidoOnly">
        só repetidos
      </label>
    </div>
    <div class="cromos-grid" id="cromosGrid"></div>
  </div>

  <footer>dados guardados no GitHub &middot; edita os ficheiros JSON para atualizar</footer>
</div>

<div id="lightbox" class="lightbox">
  <div class="lightbox-conteudo">
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-legenda">
      <div class="lightbox-linha1">
        <span id="lightboxNum"></span>
        <span id="lightboxNome"></span>
      </div>
      <div class="lightbox-clube" id="lightboxClube"></div>
      <div class="lightbox-repetido" id="lightboxRepetidoWrap" style="display:none;">
        <span>Repetidos:</span>
        <button id="repBtnMenos" type="button">−</button>
        <span id="repQtd">0</span>
        <button id="repBtnMais" type="button">+</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ====== CONFIGURAÇÃO ======
   Se estiveres a hospedar este site FORA do mesmo repositório dos dados
   (ex: Netlify apontando para outro sítio), muda USE_REMOTE para true
   e preenche GITHUB_USER / GITHUB_REPO / GITHUB_BRANCH.
   Se o site vive no MESMO repositório dos dados (GitHub Pages), deixa
   USE_REMOTE a false — os caminhos relativos já funcionam.
*/
const USE_REMOTE = false;
const GITHUB_USER = "Oliveira1973";
const GITHUB_REPO = "cromos-e-cadernetas";
const GITHUB_BRANCH = "main";

function resolvePath(relPath){
  if(!USE_REMOTE) return relPath;
  return `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${relPath}`;
}

/* ====== FIREBASE (repetidos) ======
   Cola aqui a configuração que copiaste da consola do Firebase
   (Definições do projeto → Os teus apps → configuração SDK).
   Se deixares FIREBASE_CONFIG com apiKey vazio, a funcionalidade de
   "repetidos" fica automaticamente desativada e o resto do site
   continua a funcionar normalmente.
*/
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBnNofBE6qo4kh-P7b99Hh5qiPc7WcytD4",
  authDomain: "psearch-70d23.firebaseapp.com",
  projectId: "psearch-70d23",
  storageBucket: "psearch-70d23.firebasestorage.app",
  messagingSenderId: "832369414085",
  appId: "1:832369414085:web:999b408a16981a66b845ac"
};

let db = null;
let repetidosDisponivel = false;
try{
  if(FIREBASE_CONFIG.apiKey){
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    repetidosDisponivel = true;
  }
}catch(err){
  console.warn('Firebase não inicializado:', err);
}

function idRepetido(cadernetaId, numero){
  return `${cadernetaId}__${numero}`.replace(/[/\s]/g, '_');
}

// mapa numero -> quantidade, para a caderneta atualmente aberta
let repetidosAtual = new Map();

async function carregarRepetidosDaCaderneta(cadernetaId){
  repetidosAtual = new Map();
  if(!repetidosDisponivel) return;
  try{
    const snap = await db.collection('repetidos').where('cadernetaId','==',cadernetaId).get();
    snap.forEach(doc=>{
      const d = doc.data();
      if(d.quantidade > 0) repetidosAtual.set(d.numero, d.quantidade);
    });
  }catch(err){
    console.warn('Não consegui carregar repetidos:', err);
  }
}

async function gravarRepetido(cadernetaId, cadernetaNome, numero, nomeCromo, quantidade){
  if(!repetidosDisponivel) return;
  const ref = db.collection('repetidos').doc(idRepetido(cadernetaId, numero));
  try{
    // gravamos sempre (mesmo quantidade=0) em vez de apagar -- assim só
    // precisamos de permissão de escrita nas regras do Firestore, nunca
    // de permissão de apagar. O resto do site já ignora quantidade<=0.
    await ref.set({
      cadernetaId, cadernetaNome, numero, nomeCromo,
      quantidade,
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    });
    if(quantidade > 0) repetidosAtual.set(numero, quantidade);
    else repetidosAtual.delete(numero);
  }catch(err){
    console.warn('Não consegui gravar o repetido:', err);
    alert('Não foi possível guardar (sem ligação?). Tenta outra vez.');
  }
}

async function carregarTodosRepetidos(){
  if(!repetidosDisponivel) return [];
  try{
    const snap = await db.collection('repetidos').where('quantidade','>',0).get();
    const lista = [];
    snap.forEach(doc=>lista.push(doc.data()));
    lista.sort((a,b)=> a.cadernetaNome.localeCompare(b.cadernetaNome,'pt') || a.numero.localeCompare(b.numero,'pt',{numeric:true}));
    return lista;
  }catch(err){
    console.warn('Não consegui carregar a lista de repetidos:', err);
    return [];
  }
}

let cadernetas = [];
let cromosCache = {};

async function loadCadernetas(){
  const res = await fetch(resolvePath('data/cadernetas.json'), {cache:"no-store"});
  if(!res.ok) throw new Error("Não foi possível carregar data/cadernetas.json");
  cadernetas = await res.json();
  cadernetas.sort((a,b) => (a.ano - b.ano) || a.nome.localeCompare(b.nome, 'pt'));
}

async function loadCromos(id){
  if(cromosCache[id]) return cromosCache[id];
  const res = await fetch(resolvePath(`cromos/${id}.json`), {cache:"no-store"});
  if(!res.ok) throw new Error(`Não foi possível carregar cromos/${id}.json`);
  const data = await res.json();
  cromosCache[id] = data;
  return data;
}

function stats(cromos){
  const total = cromos.length;
  const tenho = cromos.filter(c => c.tenho).length;
  const falta = total - tenho;
  const pct = total ? Math.round((tenho/total)*100) : 0;
  return {total, tenho, falta, pct};
}

function renderGlobalStats(){
  let totalCromosTodas = 0, totalTenho = 0;
  const promises = cadernetas.map(c => loadCromos(c.id).then(list => {
    totalCromosTodas += list.length;
    totalTenho += list.filter(x=>x.tenho).length;
  }));
  Promise.all(promises).then(()=>{
    const pct = totalCromosTodas ? Math.round((totalTenho/totalCromosTodas)*100) : 0;
    document.getElementById('globalStats').innerHTML = `
      <div class="stat"><span class="num">${cadernetas.length}</span><span class="lbl">cadernetas</span></div>
      <div class="stat"><span class="num">${totalTenho}</span><span class="lbl">cromos tenho</span></div>
      <div class="stat"><span class="num">${pct}%</span><span class="lbl">completo</span></div>
    `;
  });
}

function populateEditoraFilter(){
  const sel = document.getElementById('editoraFilter');
  const editoras = [...new Set(cadernetas.map(c=>c.editora))].sort();
  editoras.forEach(ed=>{
    const opt = document.createElement('option');
    opt.value = ed; opt.textContent = ed;
    sel.appendChild(opt);
  });
}

function populateTemaFilter(){
  const sel = document.getElementById('temaFilter');
  const temas = [...new Set(cadernetas.map(c=>c.tema).filter(Boolean))].sort();
  temas.forEach(t=>{
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    sel.appendChild(opt);
  });
}

async function renderGrid(){
  const grid = document.getElementById('cadGrid');
  const search = document.getElementById('searchInput').value.toLowerCase();
  const editora = document.getElementById('editoraFilter').value;
  const tema = document.getElementById('temaFilter').value;
  const incompleteOnly = document.getElementById('incompleteOnly').checked;

  grid.innerHTML = '';
  let shown = 0;

  for(const c of cadernetas){
    if(editora && c.editora !== editora) continue;
    if(tema && c.tema !== tema) continue;
    if(search && !(c.nome.toLowerCase().includes(search) || c.editora.toLowerCase().includes(search))) continue;

    const cromos = await loadCromos(c.id);
    const s = stats(cromos);
    if(incompleteOnly && s.falta === 0) continue;

    shown++;
    const card = document.createElement('div');
    card.className = 'cad-card';
    card.tabIndex = 0;
    card.setAttribute('role','button');
    card.innerHTML = `
      <div class="cover ${c.capa ? 'imagem-auto' : ''}">
        <div class="tape"></div>
        ${c.capa ? `<img src="${resolvePath(c.capa)}" alt="Capa ${c.nome}">` : `<div class="placeholder">${initials(c.nome)}</div>`}
        <div class="stamp-badge ${s.falta===0 ? 'complete':''}">${s.pct}%</div>
      </div>
      <div class="info">
        <div class="editora">${c.editora} &middot; ${c.ano}${c.tema ? ` &middot; <span class="tema-tag">${c.tema}</span>` : ''}</div>
        <h3>${c.nome}</h3>
        <div class="meta">${s.tenho} / ${s.total} cromos</div>
        <div class="bar-track"><div class="bar-fill ${s.falta===0?'complete':''}" style="width:${s.pct}%"></div></div>
      </div>
    `;
    card.addEventListener('click', ()=>openDetail(c.id));
    card.addEventListener('keypress', (e)=>{ if(e.key==='Enter') openDetail(c.id); });
    grid.appendChild(card);
  }

  document.getElementById('emptyState').style.display = shown===0 ? 'block' : 'none';
}

function initials(nome){
  return nome.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

async function openDetail(id, pushHistory=true, soRepetidos=false){
  const c = cadernetas.find(x=>x.id===id);
  const cromos = await loadCromos(id);
  const s = stats(cromos);

  document.getElementById('listView').classList.add('hidden');
  document.getElementById('detail').classList.add('active');

  if(pushHistory){
    history.pushState({view:'detail', id}, '', '#' + encodeURIComponent(id));
  }

  document.getElementById('detailCover').innerHTML = c.capa
    ? `<img src="${resolvePath(c.capa)}" alt="Capa ${c.nome}">`
    : `<div class="placeholder">${initials(c.nome)}</div>`;
  document.getElementById('detailCover').className = 'detail-cover' + (c.capa ? ' imagem-auto' : '');
  document.getElementById('detailNome').textContent = c.nome;
  document.getElementById('detailEditoraAno').textContent = `${c.editora} · ${c.ano}`;
  document.getElementById('detailTenho').textContent = s.tenho;
  document.getElementById('detailFalta').textContent = s.falta;
  document.getElementById('detailPct').textContent = s.pct + '%';
  const fill = document.getElementById('detailFill');
  fill.style.width = s.pct + '%';
  fill.className = 'fill ' + (s.falta===0 ? 'complete':'');

  document.getElementById('cromoSearch').value = '';
  document.getElementById('cromoFaltaOnly').checked = false;
  document.getElementById('cromoEspecialOnly').checked = false;
  document.getElementById('cromoRepetidoOnlyWrap').style.display = repetidosDisponivel ? '' : 'none';

  await carregarRepetidosDaCaderneta(id);
  document.getElementById('cromoRepetidoOnly').checked = soRepetidos && repetidosDisponivel;
  renderCromosGrid(cromos);

  window.scrollTo({top:0, behavior:'instant'});
}

function renderCromosGrid(cromos){
  const grid = document.getElementById('cromosGrid');
  const search = document.getElementById('cromoSearch').value.toLowerCase();
  const faltaOnly = document.getElementById('cromoFaltaOnly').checked;
  const especialOnly = document.getElementById('cromoEspecialOnly').checked;
  const repetidoOnly = document.getElementById('cromoRepetidoOnly').checked;

  grid.innerHTML = '';
  cromos.forEach(cr=>{
    const qtdRepetido = repetidosAtual.get(cr.numero) || 0;
    if(faltaOnly && cr.tenho) return;
    if(especialOnly && !cr.especial) return;
    if(repetidoOnly && qtdRepetido <= 0) return;
    if(search && !(cr.numero.toLowerCase().includes(search) || (cr.nome||'').toLowerCase().includes(search))) return;

    const el = document.createElement('div');
    const temImagem = !!cr.imagem;
    const isFoil = (cr.tipo || '').trim().toLowerCase() === 'foil';
    const legendaHtml = `
      <div class="legenda">
        <span class="num">${cr.numero}</span>
        ${cr.nome ? `<span class="nome">${cr.nome}</span>` : ''}
      </div>
      ${cr.especial ? '<div class="star">★</div>' : ''}
      ${qtdRepetido > 0 ? `<div class="repetido-badge">×${qtdRepetido}</div>` : ''}
    `;
    el.className = 'cromo ' + (cr.tenho ? 'tenho' : 'falta') + (temImagem ? ' tem-imagem' : '') + (isFoil ? ' foil' : '');
    el.dataset.numero = cr.numero;
    if(temImagem){
      el.innerHTML = `
        <div class="conteudo"><img src="${resolvePath(cr.imagem)}" alt="Cromo ${cr.numero}" loading="lazy"></div>
        ${legendaHtml}
      `;
      // se a foto não existir/falhar a carregar, volta ao visual simples
      // (só a barra número + nome, sem imagem) em vez de mostrar o ícone
      // de imagem partida
      const img = el.querySelector('img');
      img.addEventListener('error', () => {
        el.classList.remove('tem-imagem');
        el.innerHTML = `<div class="conteudo"></div>${legendaHtml}`;
      }, { once: true });
    } else {
      el.innerHTML = `<div class="conteudo"></div>${legendaHtml}`;
    }
    // qualquer cromo é clicável -- abre a vista ampliada com número, nome
    // e clube (a foto só aparece se o cromo tiver uma associada)
    el.addEventListener('click', ()=> abrirLightbox(cr));
    grid.appendChild(el);
  });
}

function showList(){
  document.getElementById('detail').classList.remove('active');
  document.getElementById('repetidosGeral').classList.remove('active');
  document.getElementById('listView').classList.remove('hidden');
}

document.getElementById('backBtn').addEventListener('click', ()=>{
  history.back();
});

document.getElementById('backBtnRepetidos').addEventListener('click', ()=>{
  document.getElementById('repetidosGeral').classList.remove('active');
  document.getElementById('listView').classList.remove('hidden');
});

document.getElementById('btnVerRepetidos').addEventListener('click', abrirRepetidosGeral);

async function abrirRepetidosGeral(){
  document.getElementById('listView').classList.add('hidden');
  document.getElementById('detail').classList.remove('active');
  document.getElementById('repetidosGeral').classList.add('active');
  window.scrollTo({top:0, behavior:'instant'});

  const conteudo = document.getElementById('repetidosGeralConteudo');
  conteudo.innerHTML = '<div class="empty">A carregar...</div>';

  const lista = await carregarTodosRepetidos();
  if(lista.length === 0){
    conteudo.innerHTML = '<div class="empty">Ainda não marcaste nenhum cromo como repetido.</div>';
    return;
  }

  const porCaderneta = new Map();
  lista.forEach(item=>{
    if(!porCaderneta.has(item.cadernetaId)) porCaderneta.set(item.cadernetaId, []);
    porCaderneta.get(item.cadernetaId).push(item);
  });

  conteudo.innerHTML = '<div class="repetidos-grid" id="repetidosGrid"></div>';
  const grid = document.getElementById('repetidosGrid');

  porCaderneta.forEach((itens, cadernetaId)=>{
    const c = cadernetas.find(x=>x.id===cadernetaId);
    const nome = itens[0].cadernetaNome;

    const grupo = document.createElement('div');
    grupo.className = 'repetidos-grupo';
    grupo.innerHTML = `
      <div class="mini-capa" tabindex="0" role="button" aria-label="Ver repetidos de ${nome}">
        <div class="mini-capa-img">
          ${c && c.capa ? `<img src="${resolvePath(c.capa)}" alt="Capa ${nome}">` : `<div class="mini-capa-placeholder">${initials(nome)}</div>`}
        </div>
        <div class="mini-capa-nome">${nome}</div>
        <div class="mini-capa-badge">${itens.length}</div>
      </div>
      <div class="repetidos-lista"></div>
    `;
    grid.appendChild(grupo);

    const capaEl = grupo.querySelector('.mini-capa');
    const listaEl = grupo.querySelector('.repetidos-lista');

    function alternar(){
      const abrir = !grupo.classList.contains('expandido');
      // fecha qualquer outro grupo aberto, para não ficarem várias listas abertas ao mesmo tempo
      grid.querySelectorAll('.repetidos-grupo.expandido').forEach(g=>{
        if(g !== grupo) g.classList.remove('expandido');
      });
      grupo.classList.toggle('expandido', abrir);

      if(abrir && listaEl.innerHTML === ''){
        listaEl.innerHTML = itens.map(it => `
          <div class="repetido-item" data-caderneta="${cadernetaId}">
            <span class="qtd">×${it.quantidade}</span>
            <span>${it.numero}${it.nomeCromo ? ' · '+it.nomeCromo : ''}</span>
          </div>
        `).join('');
        listaEl.querySelectorAll('.repetido-item').forEach(item=>{
          item.addEventListener('click', ()=>{
            document.getElementById('repetidosGeral').classList.remove('active');
            openDetail(item.dataset.caderneta, true, true);
          });
        });
      }
    }

    capaEl.addEventListener('click', alternar);
    capaEl.addEventListener('keypress', (e)=>{ if(e.key==='Enter') alternar(); });
  });
}


window.addEventListener('popstate', (e)=>{
  const state = e.state;
  if(state && state.view === 'detail' && state.id){
    openDetail(state.id, false);
  } else {
    showList();
  }
});

document.getElementById('searchInput').addEventListener('input', renderGrid);
document.getElementById('editoraFilter').addEventListener('change', renderGrid);
document.getElementById('temaFilter').addEventListener('change', renderGrid);
document.getElementById('incompleteOnly').addEventListener('change', renderGrid);
document.getElementById('cromoSearch').addEventListener('input', ()=>renderCromosGrid(cromosCache[currentId()]));
document.getElementById('cromoFaltaOnly').addEventListener('change', ()=>renderCromosGrid(cromosCache[currentId()]));
document.getElementById('cromoEspecialOnly').addEventListener('change', ()=>renderCromosGrid(cromosCache[currentId()]));
document.getElementById('cromoRepetidoOnly').addEventListener('change', ()=>renderCromosGrid(cromosCache[currentId()]));

function abrirLightbox(cr){
  cromoAtualLightbox = cr;
  const img = document.getElementById('lightboxImg');
  if(cr.imagem){
    img.src = resolvePath(cr.imagem);
    img.alt = `Cromo ${cr.numero}`;
    img.style.display = '';
  } else {
    img.removeAttribute('src');
    img.style.display = 'none';
  }
  document.getElementById('lightboxNum').textContent = cr.numero;
  document.getElementById('lightboxNome').textContent = cr.nome || '';
  document.getElementById('lightboxClube').textContent = cr.clube || '';

  const repWrap = document.getElementById('lightboxRepetidoWrap');
  if(repetidosDisponivel){
    repWrap.style.display = 'flex';
    document.getElementById('repQtd').textContent = repetidosAtual.get(cr.numero) || 0;
  } else {
    repWrap.style.display = 'none';
  }

  document.getElementById('lightbox').classList.add('aberto');
}

function fecharLightbox(){
  document.getElementById('lightbox').classList.remove('aberto');
}

document.getElementById('lightbox').addEventListener('click', fecharLightbox);

let cromoAtualLightbox = null;

function aplicarQtdNaGrelha(numero, qtd){
  const el = document.querySelector(`.cromo[data-numero="${CSS.escape(numero)}"]`);
  if(!el) return;
  const repetidoOnly = document.getElementById('cromoRepetidoOnly').checked;
  if(repetidoOnly && qtd <= 0){
    el.remove();
    return;
  }
  let badge = el.querySelector('.repetido-badge');
  if(qtd > 0){
    if(!badge){
      badge = document.createElement('div');
      badge.className = 'repetido-badge';
      el.appendChild(badge);
    }
    badge.textContent = `×${qtd}`;
  } else if(badge){
    badge.remove();
  }
}

async function ajustarRepetido(delta){
  if(!cromoAtualLightbox || !repetidosDisponivel) return;
  const cr = cromoAtualLightbox;
  const atual = repetidosAtual.get(cr.numero) || 0;
  const nova = Math.max(0, Math.min(99, atual + delta));
  if(nova === atual) return;
  document.getElementById('repQtd').textContent = nova;
  const c = cadernetas.find(x=>x.id===currentId());
  await gravarRepetido(currentId(), c ? c.nome : '', cr.numero, cr.nome||'', nova);
  aplicarQtdNaGrelha(cr.numero, nova);
}

document.getElementById('repBtnMenos').addEventListener('click', (e)=>{
  e.stopPropagation();
  ajustarRepetido(-1);
});
document.getElementById('repBtnMais').addEventListener('click', (e)=>{
  e.stopPropagation();
  ajustarRepetido(1);
});

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') fecharLightbox();
});

function currentId(){
  const nome = document.getElementById('detailNome').textContent;
  const c = cadernetas.find(x=>x.nome===nome);
  return c ? c.id : null;
}

async function init(){
  try{
    document.getElementById('acoesTopo').style.display = repetidosDisponivel ? 'block' : 'none';

    await loadCadernetas();
    populateEditoraFilter();
    populateTemaFilter();
    renderGlobalStats();
    await renderGrid();

    history.replaceState({view:'list'}, '', location.pathname + location.search);

    const idNaUrl = decodeURIComponent(location.hash.replace('#',''));
    if(idNaUrl && cadernetas.some(c=>c.id===idNaUrl)){
      await openDetail(idNaUrl);
    }
  }catch(err){
    document.getElementById('cadGrid').innerHTML = '';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('emptyState').textContent = 'Erro a carregar dados: ' + err.message;
  }
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
