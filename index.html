<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>As Minhas Cadernetas</title>
<meta name="theme-color" content="#e7dab8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #e7dab8;
    --paper-dark: #d8c79e;
    --paper-darker: #c9b98c;
    --ink: #2b2420;
    --ink-soft: #5a5044;
    --stamp-red: #b8433a;
    --stamp-red-soft: #b8433a55;
    --teal: #2f6b62;
    --mustard: #cc9a1f;
    --line: #b7a67c;
    --card-bg: #f2ead4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, #f0e5c8 0%, transparent 55%),
      var(--paper);
    background-attachment: fixed;
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  /* subtle paper grain */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    opacity:0.05;
    background-image:
      repeating-linear-gradient(0deg, #000 0, #000 1px, transparent 1px, transparent 3px);
    mix-blend-mode:multiply;
    z-index:0;
  }
  .wrap{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding: 20px 18px 80px;}

  header.top{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap: 16px; flex-wrap:wrap;
    border-bottom: 3px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 22px;
  }
  header.top .title-block h1{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size: clamp(2.1rem, 6vw, 3.2rem);
    letter-spacing: 0.5px;
    margin:0;
    line-height:0.95;
    color:var(--ink);
  }
  header.top .title-block .sub{
    font-family:'Space Mono', monospace;
    font-size:0.78rem;
    color:var(--ink-soft);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-top:6px;
  }
  .global-stats{
    display:flex; gap:18px; font-family:'Space Mono', monospace;
  }
  .global-stats .stat{ text-align:right; }
  .global-stats .stat .num{ font-size:1.6rem; font-weight:700; color:var(--stamp-red); display:block; line-height:1; }
  .global-stats .stat .lbl{ font-size:0.62rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); }

  .toolbar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    margin-bottom:22px;
  }
  .toolbar input[type="search"], .toolbar select{
    font-family:'Work Sans', sans-serif;
    font-size:0.9rem;
    padding:9px 12px;
    border:2px solid var(--ink);
    background:var(--card-bg);
    color:var(--ink);
    border-radius:2px;
  }
  .toolbar input[type="search"]{ flex:1; min-width:160px; }
  .toolbar label.switch{
    display:flex; align-items:center; gap:6px;
    font-size:0.82rem; font-family:'Space Mono',monospace;
    color:var(--ink-soft); cursor:pointer;
    padding:9px 10px; border:2px dashed var(--line); border-radius:2px;
  }
  .toolbar label.switch input{ accent-color:var(--stamp-red); }

  /* grid of cadernetas */
  .grid{
    display:flex;
    flex-wrap:wrap;
    gap: 20px;
  }
  .cad-card{
    position:relative;
    background:var(--card-bg);
    border:2px solid var(--ink);
    border-radius:3px;
    padding:0;
    cursor:pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 4px 4px 0 var(--paper-darker);
    overflow:hidden;
    width:210px;
  }
  .cad-card.tem-capa{ width:auto; max-width:380px; }
  .cad-card:hover{ transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--paper-darker); }
  .cad-card:focus-visible{ outline: 3px solid var(--teal); outline-offset:2px; }
  .cad-card .cover{
    aspect-ratio: 3/4;
    background: linear-gradient(135deg, var(--teal), #1f4e47);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .cad-card .cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .cad-card .cover.imagem-auto{
    aspect-ratio:auto;
    height:230px;
    width:auto;
    max-width:380px;
    background:var(--paper-darker);
  }
  .cad-card .cover.imagem-auto img{
    height:100%;
    width:auto;
    max-width:100%;
    object-fit:contain;
    display:block;
  }
  .cad-card .cover .placeholder{
    font-family:'Anton', sans-serif;
    color:#f2ead4d0;
    font-size:2.6rem;
    text-align:center;
    padding: 10px;
    line-height:1;
  }
  .cad-card .cover .tape{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%) rotate(-2deg);
    width:70px; height:22px;
    background:#f2ead4b3;
    border:1px solid #ffffff55;
  }
  .stamp-badge{
    position:absolute; top:8px; right:8px;
    width:52px; height:52px;
    border-radius:50%;
    border:2.5px dashed var(--stamp-red);
    display:flex; align-items:center; justify-content:center;
    background: #f2ead4cc;
    transform: rotate(-10deg);
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:0.85rem;
    color:var(--stamp-red);
  }
  .stamp-badge.complete{ border-color:var(--teal); color:var(--teal); border-style:solid; }
  .cad-card .info{ padding:12px 12px 14px; }
  .cad-card .editora{
    font-family:'Space Mono', monospace;
    font-size:0.68rem; text-transform:uppercase; letter-spacing:0.07em;
    color:var(--stamp-red); margin-bottom:2px;
  }
  .cad-card h3{
    font-family:'Anton', sans-serif; font-weight:400;
    font-size:1.15rem; margin:0 0 6px; line-height:1.05;
  }
  .cad-card .meta{
    font-family:'Space Mono', monospace; font-size:0.7rem;
    color:var(--ink-soft);
  }
  .cad-card .bar-track{
    height:6px; background:var(--paper-darker); border:1px solid var(--ink);
    margin-top:8px; border-radius:2px; overflow:hidden;
  }
  .cad-card .bar-fill{ height:100%; background:var(--stamp-red); }
  .cad-card .bar-fill.complete{ background:var(--teal); }

  /* empty state */
  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
    font-family:'Space Mono', monospace;
  }

  /* detail view */
  #detail{ display:none; }
  #detail.active{ display:block; }
  #listView.hidden{ display:none; }

  .back-btn{
    font-family:'Space Mono', monospace;
    background:none; border:2px solid var(--ink); border-radius:2px;
    padding:8px 14px; cursor:pointer; font-size:0.8rem;
    color:var(--ink); margin-bottom:16px;
  }
  .back-btn:hover{ background:var(--ink); color:var(--paper); }

  .detail-header{
    display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap;
    border-bottom:3px solid var(--ink); padding-bottom:18px; margin-bottom:18px;
  }
  .detail-cover{
    width:110px; aspect-ratio:3/4; border:2px solid var(--ink); border-radius:3px;
    background:linear-gradient(135deg, var(--teal), #1f4e47);
    display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;
  }
  .detail-cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .detail-cover.imagem-auto{ aspect-ratio:auto; height:auto; background:var(--paper-darker); }
  .detail-cover.imagem-auto img{ height:auto; object-fit:contain; }
  .detail-cover .placeholder{ font-family:'Anton',sans-serif; color:#f2ead4d0; font-size:1.8rem; }
  .detail-title h2{ font-family:'Anton', sans-serif; font-weight:400; font-size:1.8rem; margin:0 0 4px; }
  .detail-title .editora-ano{ font-family:'Space Mono', monospace; font-size:0.78rem; color:var(--stamp-red); text-transform:uppercase; letter-spacing:0.06em; }
  .detail-stats{ display:flex; gap:20px; margin-top:10px; font-family:'Space Mono', monospace; }
  .detail-stats .stat .num{ font-size:1.3rem; font-weight:700; }
  .detail-stats .stat .lbl{ font-size:0.6rem; text-transform:uppercase; color:var(--ink-soft); letter-spacing:0.06em; }
  .detail-progress{ margin-top:12px; height:10px; background:var(--paper-darker); border:1px solid var(--ink); border-radius:2px; overflow:hidden; }
  .detail-progress .fill{ height:100%; background:var(--stamp-red); }
  .detail-progress .fill.complete{ background:var(--teal); }

  .cromos-toolbar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }

  .cromos-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .cromo{
    position:relative;
    width:90px;
    aspect-ratio:3/4;
    border:2px solid var(--ink);
    border-radius:2px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Space Mono', monospace;
    background:var(--card-bg);
    cursor:default;
    padding:2px;
    text-align:center;
    overflow:hidden;
  }
  .cromo.tenho{ background:#dfe9d8; border-color:var(--teal); }
  .cromo.falta{
    background:repeating-linear-gradient(45deg, var(--paper-darker), var(--paper-darker) 4px, var(--card-bg) 4px, var(--card-bg) 8px);
    border-style:dashed;
    color:var(--ink-soft);
  }
  .cromo.tem-imagem{
    padding:0;
    justify-content:flex-end;
    aspect-ratio:auto;
    display:block;
    width:auto;
    height:100px;
    max-width:220px;
  }
  .cromo.tem-imagem img{
    position:static;
    width:auto;
    height:100%;
    max-width:100%;
    object-fit:contain;
    display:block;
  }
  .cromo.tem-imagem.falta img{ filter: grayscale(0.85) brightness(0.9); opacity:0.55; }
  .cromo.tem-imagem .num-badge{
    position:absolute; top:4px; left:4px; z-index:1;
    background:var(--ink);
    color:var(--paper);
    font-size:0.6rem;
    font-weight:700;
    padding:1px 4px;
    border-radius:2px;
  }
  .cromo.tem-imagem .nome-overlay{
    position:absolute; left:0; right:0; bottom:0; z-index:1;
    position:relative; z-index:1;
    width:100%;
    background:linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    color:#fff;
    font-size:0.5rem;
    line-height:1.15;
    padding:5px 3px 3px;
    text-shadow:0 1px 2px rgba(0,0,0,0.8);
    overflow:hidden; text-overflow:ellipsis;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }
  .cromo .num{ font-weight:700; font-size:0.85rem; }
  .cromo .nome{ font-size:0.52rem; margin-top:2px; line-height:1.1; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .cromo .star{
    position:absolute; top:-7px; right:-7px;
    width:18px; height:18px;
    background:var(--mustard);
    border-radius:50%;
    border:1.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:0.6rem;
  }

  footer{
    text-align:center; margin-top:60px; padding-top:20px;
    border-top:1px dashed var(--line);
    font-family:'Space Mono', monospace; font-size:0.7rem; color:var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce){
    .cad-card{ transition:none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="title-block">
      <h1>As Minhas Cadernetas</h1>
      <div class="sub">coleção de cromos &middot; faltas &amp; repetidos</div>
    </div>
    <div class="global-stats" id="globalStats"></div>
  </header>

  <div id="listView">
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Procurar caderneta ou editora...">
      <select id="editoraFilter">
        <option value="">Todas as editoras</option>
      </select>
      <label class="switch">
        <input type="checkbox" id="incompleteOnly">
        só por completar
      </label>
    </div>
    <div class="grid" id="cadGrid"></div>
    <div class="empty" id="emptyState" style="display:none;">Nenhuma caderneta encontrada.</div>
  </div>

  <div id="detail">
    <button class="back-btn" id="backBtn">&larr; voltar às cadernetas</button>
    <div class="detail-header">
      <div class="detail-cover" id="detailCover"></div>
      <div class="detail-title">
        <h2 id="detailNome"></h2>
        <div class="editora-ano" id="detailEditoraAno"></div>
        <div class="detail-stats">
          <div class="stat"><span class="num" id="detailTenho"></span><span class="lbl">tenho</span></div>
          <div class="stat"><span class="num" id="detailFalta"></span><span class="lbl">faltam</span></div>
          <div class="stat"><span class="num" id="detailPct"></span><span class="lbl">completo</span></div>
        </div>
        <div class="detail-progress"><div class="fill" id="detailFill"></div></div>
      </div>
    </div>

    <div class="cromos-toolbar">
      <input type="search" id="cromoSearch" placeholder="Procurar número ou nome...">
      <label class="switch">
        <input type="checkbox" id="cromoFaltaOnly">
        só faltas
      </label>
      <label class="switch">
        <input type="checkbox" id="cromoEspecialOnly">
        só especiais
      </label>
    </div>
    <div class="cromos-grid" id="cromosGrid"></div>
  </div>

  <footer>dados guardados no GitHub &middot; edita os ficheiros JSON para atualizar</footer>
</div>

<script>
/* ====== CONFIGURAÇÃO ======
   Se estiveres a hospedar este site FORA do mesmo repositório dos dados
   (ex: Netlify apontando para outro sítio), muda USE_REMOTE para true
   e preenche GITHUB_USER / GITHUB_REPO / GITHUB_BRANCH.
   Se o site vive no MESMO repositório dos dados (GitHub Pages), deixa
   USE_REMOTE a false — os caminhos relativos já funcionam.
*/
const USE_REMOTE = false;
const GITHUB_USER = "Oliveira1973";
const GITHUB_REPO = "cromos-e-cadernetas";
const GITHUB_BRANCH = "main";

function resolvePath(relPath){
  if(!USE_REMOTE) return relPath;
  return `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${relPath}`;
}

let cadernetas = [];
let cromosCache = {};

async function loadCadernetas(){
  const res = await fetch(resolvePath('data/cadernetas.json'), {cache:"no-store"});
  if(!res.ok) throw new Error("Não foi possível carregar data/cadernetas.json");
  cadernetas = await res.json();
  cadernetas.sort((a,b) => (a.ano - b.ano) || a.nome.localeCompare(b.nome, 'pt'));
}

async function loadCromos(id){
  if(cromosCache[id]) return cromosCache[id];
  const res = await fetch(resolvePath(`cromos/${id}.json`), {cache:"no-store"});
  if(!res.ok) throw new Error(`Não foi possível carregar cromos/${id}.json`);
  const data = await res.json();
  cromosCache[id] = data;
  return data;
}

function stats(cromos){
  const total = cromos.length;
  const tenho = cromos.filter(c => c.tenho).length;
  const falta = total - tenho;
  const pct = total ? Math.round((tenho/total)*100) : 0;
  return {total, tenho, falta, pct};
}

function renderGlobalStats(){
  let totalCromosTodas = 0, totalTenho = 0;
  const promises = cadernetas.map(c => loadCromos(c.id).then(list => {
    totalCromosTodas += list.length;
    totalTenho += list.filter(x=>x.tenho).length;
  }));
  Promise.all(promises).then(()=>{
    const pct = totalCromosTodas ? Math.round((totalTenho/totalCromosTodas)*100) : 0;
    document.getElementById('globalStats').innerHTML = `
      <div class="stat"><span class="num">${cadernetas.length}</span><span class="lbl">cadernetas</span></div>
      <div class="stat"><span class="num">${totalTenho}</span><span class="lbl">cromos tenho</span></div>
      <div class="stat"><span class="num">${pct}%</span><span class="lbl">completo</span></div>
    `;
  });
}

function populateEditoraFilter(){
  const sel = document.getElementById('editoraFilter');
  const editoras = [...new Set(cadernetas.map(c=>c.editora))].sort();
  editoras.forEach(ed=>{
    const opt = document.createElement('option');
    opt.value = ed; opt.textContent = ed;
    sel.appendChild(opt);
  });
}

async function renderGrid(){
  const grid = document.getElementById('cadGrid');
  const search = document.getElementById('searchInput').value.toLowerCase();
  const editora = document.getElementById('editoraFilter').value;
  const incompleteOnly = document.getElementById('incompleteOnly').checked;

  grid.innerHTML = '';
  let shown = 0;

  for(const c of cadernetas){
    if(editora && c.editora !== editora) continue;
    if(search && !(c.nome.toLowerCase().includes(search) || c.editora.toLowerCase().includes(search))) continue;

    const cromos = await loadCromos(c.id);
    const s = stats(cromos);
    if(incompleteOnly && s.falta === 0) continue;

    shown++;
    const card = document.createElement('div');
    card.className = 'cad-card' + (c.capa ? ' tem-capa' : '');
    card.tabIndex = 0;
    card.setAttribute('role','button');
    card.innerHTML = `
      <div class="cover ${c.capa ? 'imagem-auto' : ''}">
        <div class="tape"></div>
        ${c.capa ? `<img src="${resolvePath(c.capa)}" alt="Capa ${c.nome}">` : `<div class="placeholder">${initials(c.nome)}</div>`}
        <div class="stamp-badge ${s.falta===0 ? 'complete':''}">${s.pct}%</div>
      </div>
      <div class="info">
        <div class="editora">${c.editora} &middot; ${c.ano}</div>
        <h3>${c.nome}</h3>
        <div class="meta">${s.tenho} / ${s.total} cromos</div>
        <div class="bar-track"><div class="bar-fill ${s.falta===0?'complete':''}" style="width:${s.pct}%"></div></div>
      </div>
    `;
    card.addEventListener('click', ()=>openDetail(c.id));
    card.addEventListener('keypress', (e)=>{ if(e.key==='Enter') openDetail(c.id); });
    grid.appendChild(card);
  }

  document.getElementById('emptyState').style.display = shown===0 ? 'block' : 'none';
}

function initials(nome){
  return nome.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

async function openDetail(id, pushHistory=true){
  const c = cadernetas.find(x=>x.id===id);
  const cromos = await loadCromos(id);
  const s = stats(cromos);

  document.getElementById('listView').classList.add('hidden');
  document.getElementById('detail').classList.add('active');

  if(pushHistory){
    history.pushState({view:'detail', id}, '', '#' + encodeURIComponent(id));
  }

  document.getElementById('detailCover').innerHTML = c.capa
    ? `<img src="${resolvePath(c.capa)}" alt="Capa ${c.nome}">`
    : `<div class="placeholder">${initials(c.nome)}</div>`;
  document.getElementById('detailCover').className = 'detail-cover' + (c.capa ? ' imagem-auto' : '');
  document.getElementById('detailNome').textContent = c.nome;
  document.getElementById('detailEditoraAno').textContent = `${c.editora} · ${c.ano}`;
  document.getElementById('detailTenho').textContent = s.tenho;
  document.getElementById('detailFalta').textContent = s.falta;
  document.getElementById('detailPct').textContent = s.pct + '%';
  const fill = document.getElementById('detailFill');
  fill.style.width = s.pct + '%';
  fill.className = 'fill ' + (s.falta===0 ? 'complete':'');

  document.getElementById('cromoSearch').value = '';
  document.getElementById('cromoFaltaOnly').checked = false;
  document.getElementById('cromoEspecialOnly').checked = false;

  renderCromosGrid(cromos);

  window.scrollTo({top:0, behavior:'instant'});
}

function renderCromosGrid(cromos){
  const grid = document.getElementById('cromosGrid');
  const search = document.getElementById('cromoSearch').value.toLowerCase();
  const faltaOnly = document.getElementById('cromoFaltaOnly').checked;
  const especialOnly = document.getElementById('cromoEspecialOnly').checked;

  grid.innerHTML = '';
  cromos.forEach(cr=>{
    if(faltaOnly && cr.tenho) return;
    if(especialOnly && !cr.especial) return;
    if(search && !(cr.numero.toLowerCase().includes(search) || (cr.nome||'').toLowerCase().includes(search))) return;

    const el = document.createElement('div');
    const temImagem = !!cr.imagem;
    el.className = 'cromo ' + (cr.tenho ? 'tenho' : 'falta') + (temImagem ? ' tem-imagem' : '');
    if(temImagem){
      el.innerHTML = `
        <img src="${resolvePath(cr.imagem)}" alt="Cromo ${cr.numero}" loading="lazy">
        <div class="num-badge">${cr.numero}</div>
        ${cr.nome ? `<div class="nome-overlay">${cr.nome}</div>` : ''}
        ${cr.especial ? '<div class="star">★</div>' : ''}
      `;
    } else {
      el.innerHTML = `
        <div class="num">${cr.numero}</div>
        <div class="nome">${cr.nome||''}</div>
        ${cr.especial ? '<div class="star">★</div>' : ''}
      `;
    }
    grid.appendChild(el);
  });
}

function showList(){
  document.getElementById('detail').classList.remove('active');
  document.getElementById('listView').classList.remove('hidden');
}

document.getElementById('backBtn').addEventListener('click', ()=>{
  history.back();
});

window.addEventListener('popstate', (e)=>{
  const state = e.state;
  if(state && state.view === 'detail' && state.id){
    openDetail(state.id, false);
  } else {
    showList();
  }
});

document.getElementById('searchInput').addEventListener('input', renderGrid);
document.getElementById('editoraFilter').addEventListener('change', renderGrid);
document.getElementById('incompleteOnly').addEventListener('change', renderGrid);
document.getElementById('cromoSearch').addEventListener('input', ()=>renderCromosGrid(cromosCache[currentId()]));
document.getElementById('cromoFaltaOnly').addEventListener('change', ()=>renderCromosGrid(cromosCache[currentId()]));
document.getElementById('cromoEspecialOnly').addEventListener('change', ()=>renderCromosGrid(cromosCache[currentId()]));

function currentId(){
  const nome = document.getElementById('detailNome').textContent;
  const c = cadernetas.find(x=>x.nome===nome);
  return c ? c.id : null;
}

async function init(){
  try{
    await loadCadernetas();
    populateEditoraFilter();
    renderGlobalStats();
    await renderGrid();

    history.replaceState({view:'list'}, '', location.pathname + location.search);

    const idNaUrl = decodeURIComponent(location.hash.replace('#',''));
    if(idNaUrl && cadernetas.some(c=>c.id===idNaUrl)){
      await openDetail(idNaUrl);
    }
  }catch(err){
    document.getElementById('cadGrid').innerHTML = '';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('emptyState').textContent = 'Erro a carregar dados: ' + err.message;
  }
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
